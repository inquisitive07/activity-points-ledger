[alembic]
script_location = alembic
prepend_sys_path = .
# Active migration history: the 14-table baseline. alembic/versions/ holds the superseded UUID-schema migrations,
# kept (unused) until the team confirms no database depends on them; Alembic does not read that folder.
version_locations = %(here)s/alembic/versions_v2

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
